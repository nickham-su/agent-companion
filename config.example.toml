# 相对路径以配置文件所在目录为准。
database = "db.sqlite3"
# 日志只写标准输出，部署默认 WARNING；排查时改为 DEBUG，修改后重启。
log_level = "WARNING"
# 切换时只改对应引用，再重启；真实 Key 请只填写在本机私有配置中。
llm_provider = "deepseek_default"  # 或 "openai_default"
asr_provider = "minimax_cn"       # 文字模式也用它转写飞书语音条
tts_provider = "minimax_cn"       # 仅 voice 模式使用；可指向另一套 MiniMax 配置

# 各能力共用同一时限，切换 Provider 不变。单位为秒。
[timeouts]
llm = 60  # 单次模型请求总时限
asr = 30  # 单次转写总时限
tts = 25  # 单次网络读写、等待响应的时限

[runtime]
# 压缩软阈值，不是模型上限：上次普通请求的实际输入 token 达到该值时，下次请求前尝试压缩。
# 请按实际使用的模型和服务端点的上下文上限配置，为下一轮新增输入、工具结果和模型输出留足空间。
context_budget = 64000
tail_budget = 16000  # 压缩历史时保留最近消息原文的预算，须小于 context_budget
max_tool_rounds = 8  # 一次运行的模型请求轮数上限，含首轮

# 正式启动必须显式选择适配器及推理强度。
[providers.deepseek_default]
adapter = "deepseek"
api_key = "your-deepseek-api-key"

[providers.deepseek_default.llm]
model = "deepseek-flash"       # DeepSeek 可省略模型名，默认此值
reasoning_effort = "disabled"  # 关闭思考；启用时按模型填写强度

[providers.openai_default]
adapter = "openai_responses"
api_key = "your-openai-api-key"
# base_url = "https://api.openai.com/v1"  # 可省略；仅设可信 HTTPS 地址，自定义服务会收到 Key 和模型输入

[providers.openai_default.llm]
model = "your-openai-model"
reasoning_effort = "low"  # 支持的值取决于所选模型

[providers.minimax_cn]
adapter = "minimax"
api_key = "your-minimax-api-key"
region = "cn"  # cn 或 global（应与 MiniMax API 账号的区域一致）

[providers.minimax_cn.asr]
model = "asr-1.0"  # 可省略，默认 asr-1.0；所选模型须兼容 MiniMax 文件转写接口
max_audio_seconds = 500  # 必填；按所选模型的单文件时长上限填写（秒）

[providers.minimax_cn.tts]
model = "speech-2.8-turbo"
voice_id = "male-qn-qingse"

# 默认文字模式自动发现真人私聊，每人独立会话；own_open_id 与 CLI 登录账号一致。
# [feishu]
# own_open_id = "ou_self_example"
# mode = "text"  # 默认 text；voice 保留文字，并自动接听符合条件的飞书来电
# voice_text_copy = true  # 仅 voice：已确认并入库的正文另发到原对端私聊
# cli = "lark-cli"
# cli_timeout = 20  # 单次飞书 CLI 调用时限（秒）

# 仅 [feishu].mode = "voice" 时使用音频设备。需要两条不同的虚拟线路。
# [voice]
# input_device = "Feishu to Agent"  # 飞书扬声器 → Agent；填设备精确名称或 sounddevice 索引
# output_device = "Agent to Feishu"  # Agent → 飞书麦克风；填设备精确名称或 sounddevice 索引
# vad_model = "models/silero_vad.onnx"  # VAD 模型路径，相对配置文件所在目录；不自动下载
# vad_threshold = 0.5  # 判定人声的概率门槛，须大于 0 且小于 1
# speech_frames = 3  # 连续多少个 32 毫秒的人声帧才确认开口
# silence_seconds = 1  # 连续静默多久后结束本轮录音（秒）
# output_sample_rate = 44100  # TTS 合成与本机播放共用的采样率（Hz）；录音固定 16000 Hz
