# 相对路径以配置文件所在目录为准。
# 角色文件另从启动工作目录的 agents/ 读取；正式启动前从 agents/main.example.md 复制并配置 main.md。
# 如需委派，从 agents/sub.example.md 创建实际子角色；角色正文会发给模型，不要填写敏感信息。
database = "db-search.sqlite3"  # 搜索版使用新路径；保留旧库，不迁移或清空。
# 用户工作区的共同根目录；子目录按用户分配、按需创建，不是沙箱。
workspace_root = "workspaces"
# 日志只写标准输出，部署默认 WARNING；排查时改为 DEBUG，修改后重启。
log_level = "WARNING"
# 真实 Key 只填写在本机私有配置中；Agent 的语言模型由各自的 model_id 选择。
asr_model = "minimax_asr"  # 引用 models.asr 下的 ID；也可选 "bailian_asr"。语音条和实时通话共用
tts_model = "minimax_tts"  # 引用 models.tts 下的 ID；也可选 "bailian_tts"。仅 voice 使用

# 每种能力共用自己的时限，切换模型不变。单位为秒。
[timeouts]
llm = 60  # 子 Agent 和后台摘要的固定模型时限，也用于主回复的本地请求准备
llm_idle = 180  # 主 Agent 单次尝试的连续无输出时限；单轮总时限固定为 600 秒
asr = 30  # 文件转写总时限，含握手、上传和等结果；流式 ASR 的启动和停口后等待分别计时
tts = 25  # 单次网络读写、等待响应的时限

# Provider 只定义连接；可供多个模型配置共用。
[providers.deepseek_default]
adapter = "deepseek"
api_key = "your-deepseek-api-key"

[providers.openai_default]
adapter = "openai_responses"
api_key = "your-openai-api-key"
# base_url = "https://api.openai.com/v1"  # 默认；不配置时使用官方地址
# base_url = "http://127.0.0.1:8000/v1"  # 仅用于可信本机或内网的 Responses 服务；不要发送云端 Key

# MiniMax 和百炼各用一个 Provider 供 LLM 与语音共用；如需使用不同的 Key，可以拆开配置。
[providers.minimax_cn]
adapter = "minimax"
api_key = "your-minimax-api-key"
region = "cn"  # cn 或 global（应与 MiniMax API 账号的区域一致）

[providers.bailian_beijing]
adapter = "bailian"
api_key = "your-bailian-api-key"  # LLM 使用此地域和业务空间的按量付费 Key
region = "cn-beijing"  # 也可用 ap-southeast-1；Key、业务空间、模型和音色须在所选地域可用
workspace_id = "your-workspace-id"

# LLM 配置 ID 由角色文件的 model_id 引用，不是服务商模型名。
[models.llm.chat]
provider = "deepseek_default"
model = "deepseek-flash"
reasoning_effort = "disabled"  # 关闭思考；启用时按模型填写强度
context_budget = 64000  # 压缩软阈值，不是模型上限；请为下一轮新增内容和输出留余量
tail_budget = 16000  # 压缩时保留近期历史原文的预算，须小于 context_budget
max_tool_rounds = 8  # 可省略（默认 8），一次运行的模型请求轮数上限，含首轮

# 如给角色设置 model_id = "review"，请填真实可用的模型名和对应 Provider 的 Key。
[models.llm.review]
provider = "openai_default"
model = "your-openai-model"
reasoning_effort = "low"  # 支持的值取决于所选模型
context_budget = 32000
tail_budget = 8000

# 要切换某个角色，在它的 agents/<角色>.md 中设置 model_id = "minimax_chat" 或 "bailian_chat"。
[models.llm.minimax_chat]
provider = "minimax_cn"
model = "MiniMax-M3.1-Flash"
reasoning_effort = "low"  # 开启思考；"disabled" 会请求关闭，是否支持由厂商决定（本示例模型不支持）
context_budget = 64000
tail_budget = 16000

[models.llm.bailian_chat]
provider = "bailian_beijing"
model = "qwen3.8-flash"  # 业务空间支持的带命名空间模型也可按原 ID 填写，如 kimi/kimi-k3
reasoning_effort = "enabled"  # 明文思考；用 "disabled" 关闭本轮思考
# preserve_thinking = true  # 允许厂商使用历史明文推理；省略时由厂商按模型决定
context_budget = 64000
tail_budget = 16000

[models.asr.minimax_asr]
provider = "minimax_cn"
model = "asr-1.0"  # 可省略，默认 asr-1.0；所选模型须兼容 MiniMax 文件转写接口
max_audio_seconds = 500  # 必填；按所选模型的单文件时长上限填写（秒）

[models.asr.bailian_asr]
provider = "bailian_beijing"
model = "qwen-audio-3.1-asr-flash-message"  # 语音条用文件接口；实时通话用流式接口
# 120 秒的 16 kHz 单声道 16-bit PCM WAV 按当前 128 kB/s 策略仅上传就约需 30 秒；
# 默认 timeouts.asr 不保证文件能转写到此上限。通话流式路径边录边发，停口后的等待仍默认为 30 秒。
max_audio_seconds = 120  # 必填，应用侧单轮录音/WAV 上限（秒），不是服务商配额

[models.tts.minimax_tts]
provider = "minimax_cn"
model = "speech-2.8-turbo"
voice_id = "male-qn-qingse"

[models.tts.bailian_tts]
provider = "bailian_beijing"
model = "qwen-audio-3.1-tts-flash"
voice_id = "longanhuan_v3.1"  # 示例配对；也可将两项同时改为 cosyvoice-v3-flash / longanyang

# 默认文字模式自动发现真人私聊，每人独立会话；服务账号由启动时的 CLI 登录身份决定。
# 飞书 CLI 需用户身份、search:message 及批量取正文/下载/发消息权限。
# [feishu]
# mode = "text"  # 默认 text；voice 保留文字，并自动接听符合条件的飞书来电
# voice_text_copy = true  # 仅 voice：已确认并入库的正文另发到原对端私聊
# cli = "lark-cli"
# cli_timeout = 20  # 单次飞书 CLI 调用时限（秒）

# 仅 [feishu].mode = "voice" 时使用音频设备。需要两条不同的虚拟线路。
# [voice]
# input_device = "Feishu to Agent"  # 飞书扬声器 → Agent；填设备精确名称或 sounddevice 索引
# output_device = "Agent to Feishu"  # Agent → 飞书麦克风；填设备精确名称或 sounddevice 索引
# vad_model = "models/silero_vad.onnx"  # VAD 模型路径，相对配置文件所在目录；不自动下载
# vad_threshold = 0.5  # 判定人声的概率门槛，须大于 0 且小于 1
# speech_frames = 3  # 连续多少个 32 毫秒的人声帧才确认开口
# silence_seconds = 1  # 连续静默多久后结束本轮录音（秒）
# segment_pause_seconds = 0.4  # 只在通话走文件 ASR 时生效；连续静默多久可切段（秒）
# output_sample_rate = 44100  # TTS 和播放共用（Hz）；百炼不支持 32000，录音固定 16000
# prefetch_seconds = 0.4  # 待播音频少于此时长才合成下一段（秒）
# buffer_seconds = 2  # 待播音频缓存上限（秒），须大于 prefetch_seconds
# idle_timeout = 30  # 模型输出结束后，允许多久没有实际播放进展（秒）
# delivery_timeout = 600  # 从语音投递开始算的总时限，不续期（秒）
